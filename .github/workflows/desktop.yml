name: desktop
on:
  push:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build desktop/Lumivane.sln -c Release
      - name: Core tests
        run: dotnet test desktop/tests/Lumivane.Core.Tests -c Release --no-build
      - name: Platform tests (X11 and PulseAudio tests skip themselves when no server is configured)
        if: runner.os == 'Linux'
        run: dotnet test desktop/tests/Lumivane.Platform.Tests -c Release --no-build
